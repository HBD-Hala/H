<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Happy Birthday Hala</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rye&family=Montserrat:ital,wght@0,700;0,800;0,900;1,800&family=Inter:wght@400;500;600;700&family=Great+Vibes&display=swap" rel="stylesheet">

<style>
:root {
  --bg-dark: #1a0102;
  --bg-main: #3b0204;
  --bg-light: #580407;
  --accent-pink: #DA8292;
  --accent-soft: #F5D6DC;
  --cd-deep-red: #740003;
  --gold-primary: #DA8292;
  --gold-glow: rgba(218, 130, 146, 0.4);
  --surface-glass: rgba(59, 2, 4, 0.65);
  --border-pink: rgba(218, 130, 146, 0.3);
  --border-gold: rgba(245, 214, 220, 0.35);
  --text-main: #F5D6DC;
  --text-pure: #ffffff;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { width: 100%; min-height: 100vh; overflow-x: hidden; scroll-behavior: smooth; }

body {
  font-family: 'Inter', sans-serif;
  background: radial-gradient(circle at 50% 30%, #580407 0%, #3b0204 60%, #1a0102 100%);
  background-attachment: fixed;
  color: var(--text-main);
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  -webkit-font-smoothing: antialiased;
}

.pin-overlay {
  position: fixed; inset: 0; z-index: 9999;
  background: rgba(15, 1, 2, 0.94);
  backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
  transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
}

.pin-overlay.unlocked {
  opacity: 0; pointer-events: none; transform: scale(1.06);
}

.pin-card {
  background: rgba(218, 130, 146, 0.06);
  backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px);
  border: 1.5px solid rgba(245, 214, 220, 0.22);
  border-radius: 28px;
  padding: 44px 34px;
  width: 100%; max-width: 380px;
  text-align: center;
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
  animation: cardIn 0.5s ease-out;
  position: relative;
  overflow: hidden;
}

@keyframes cardIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.pin-title {
  font-family: 'Montserrat', sans-serif;
  font-size: 21px; font-weight: 800;
  color: var(--accent-soft);
  margin-bottom: 6px;
  letter-spacing: 2px;
}

.pin-subtitle {
  font-size: 13px; color: var(--accent-pink);
  margin-bottom: 28px; opacity: 0.85;
}

.pin-input-group {
  display: flex; justify-content: center; gap: 12px; margin-bottom: 28px;
}

.pin-digit {
  width: 52px; height: 58px;
  border-radius: 16px;
  background: rgba(26, 1, 2, 0.6);
  border: 1.5px solid var(--border-pink);
  color: var(--accent-soft);
  font-size: 24px; font-weight: 700;
  text-align: center;
  outline: none;
  transition: all 0.25s ease;
}

.pin-digit:focus {
  border-color: var(--accent-soft);
  box-shadow: 0 0 18px rgba(245, 214, 220, 0.35);
  background: rgba(59, 2, 4, 0.8);
}

.pin-btn {
  width: 100%; padding: 15px;
  border-radius: 99px; border: none;
  background: linear-gradient(135deg, var(--accent-pink), var(--accent-soft));
  color: #380103;
  font-size: 14px; font-weight: 800;
  letter-spacing: 2px; cursor: pointer;
  transition: all 0.3s ease;
  box-shadow: 0 8px 25px rgba(218, 130, 146, 0.25);
}

.pin-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 30px rgba(218, 130, 146, 0.45);
}

.shake {
  animation: shakeAnim 0.4s ease-in-out;
}

@keyframes shakeAnim {
  0%, 100% { transform: translateX(0); }
  20%, 60% { transform: translateX(-10px); }
  40%, 80% { transform: translateX(10px); }
}

.site-content {
  width: 100%;
  padding: 30px 0 0 0;
  position: relative; z-index: 2;
  display: flex; flex-direction: column; align-items: center;
  opacity: 0; transform: translateY(20px);
  transition: opacity 0.8s ease, transform 0.8s ease;
}

.site-content.visible {
  opacity: 1; transform: translateY(0);
}

.birthday-header {
  text-align: center;
  margin-top: 10px; margin-bottom: 35px;
  padding: 0 20px;
  width: 100%;
}

.banner-line-1 {
  font-family: 'Rye', cursive, serif;
  font-size: clamp(28px, 6vw, 56px);
  color: var(--accent-pink);
  text-shadow: 3px 3px 0px #1a0102, 0 0 18px rgba(218, 130, 146, 0.4);
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 5px;
}

.banner-line-2 {
  font-family: 'Rye', cursive, serif;
  font-size: clamp(42px, 10vw, 90px);
  color: var(--accent-soft);
  text-shadow: 4px 4px 0px #1a0102, 0 0 25px rgba(245, 214, 220, 0.45);
  letter-spacing: 6px;
  text-transform: uppercase;
  line-height: 1;
}

.video-section {
  width: 100%; max-width: 880px;
  padding: 0 20px;
  margin: 0 auto 50px auto;
  display: flex; justify-content: center;
}

.video-card {
  width: 100%;
  background: rgba(35, 2, 4, 0.6);
  backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
  border: 1.5px solid var(--border-pink);
  border-radius: 24px;
  padding: 14px;
  box-shadow: 0 25px 60px rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(245, 214, 220, 0.2);
  transition: border-color 0.3s ease, box-shadow 0.3s ease;
}

.video-card:hover {
  border-color: var(--accent-soft);
  box-shadow: 0 30px 70px rgba(0, 0, 0, 0.75), 0 0 25px rgba(218, 130, 146, 0.25);
}

.video-wrapper {
  position: relative; width: 100%; aspect-ratio: 16 / 9;
  border-radius: 18px; overflow: hidden;
  background: #120001;
  display: flex; align-items: center; justify-content: center;
}

.video-wrapper video {
  width: 100%; height: 100%; object-fit: cover; outline: none; border: none; display: block;
}

.video-overlay-btn {
  position: absolute; inset: 0;
  background: rgba(20, 1, 2, 0.35);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  cursor: pointer; transition: opacity 0.35s ease; z-index: 5;
}

.video-overlay-btn.hidden { opacity: 0; pointer-events: none; }

.play-icon-circle {
  width: 68px; height: 68px; border-radius: 50%;
  background: linear-gradient(135deg, var(--accent-pink), var(--accent-soft));
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 0 30px rgba(245, 214, 220, 0.5);
  transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

.play-icon-circle svg { width: 30px; height: 30px; fill: #380103; margin-left: 3px; }

.video-overlay-btn:hover .play-icon-circle { transform: scale(1.12); }

.custom-controls {
  position: absolute; bottom: 0; left: 0; right: 0;
  padding: 12px 16px;
  background: linear-gradient(0deg, rgba(20, 1, 2, 0.88) 0%, rgba(20, 1, 2, 0.4) 70%, transparent 100%);
  display: flex; flex-direction: column; gap: 8px;
  z-index: 6; opacity: 0; transition: opacity 0.3s ease;
}

.video-wrapper:hover .custom-controls,
.custom-controls.active {
  opacity: 1;
}

.progress-bar-container {
  width: 100%; height: 6px;
  background: rgba(245, 214, 220, 0.25);
  border-radius: 10px; cursor: pointer;
  position: relative; overflow: hidden;
  transition: height 0.2s ease;
}

.progress-bar-container:hover { height: 8px; }

.progress-fill {
  height: 100%; width: 0%;
  background: linear-gradient(90deg, var(--accent-pink), var(--accent-soft));
  border-radius: 10px;
}

.controls-row {
  display: flex; align-items: center; justify-content: space-between;
  color: var(--accent-soft); font-size: 12px; font-weight: 600;
}

.controls-left, .controls-right {
  display: flex; align-items: center; gap: 12px;
}

.ctrl-btn {
  background: none; border: none; cursor: pointer; color: var(--accent-soft);
  display: flex; align-items: center; justify-content: center;
  padding: 4px; border-radius: 6px; transition: color 0.2s, transform 0.2s;
}

.ctrl-btn:hover { color: #ffffff; transform: scale(1.1); }
.ctrl-btn svg { width: 20px; height: 20px; fill: currentColor; }

.volume-group {
  display: flex; align-items: center; gap: 6px;
}

.volume-slider {
  -webkit-appearance: none;
  appearance: none;
  width: 70px;
  height: 4px;
  border-radius: 4px;
  background: linear-gradient(to right, #ffffff 100%, rgba(255, 255, 255, 0.25) 100%);
  outline: none;
  cursor: pointer;
  transition: background 0.1s ease;
}

.volume-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 12px; height: 12px; border-radius: 50%;
  background: #ffffff; cursor: pointer;
  box-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
}

.volume-slider::-moz-range-thumb {
  width: 12px; height: 12px; border-radius: 50%;
  background: #ffffff; cursor: pointer; border: none;
  box-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
}

.gallery-scroll-section {
  width: 100vw;
  position: relative;
  /* Increased height for extended scroll range & relaxed card browsing */
  height: 750vh;
}

.gallery-sticky-pin {
  position: sticky;
  top: 0;
  height: 100vh;
  width: 100vw;
  display: flex;
  align-items: center;
  overflow: hidden;
  background: linear-gradient(180deg, rgba(26,1,2,0) 0%, rgba(15,1,2,0.85) 30%, rgba(15,1,2,0.85) 70%, rgba(26,1,2,0) 100%);
}

.filmstrip-hero-container {
  width: 100vw;
  height: 320px;
  position: relative;
  display: flex;
  align-items: center;
}

/* Redesigned CD Disc Wrapper with new requested colors */
.vinyl-wrapper {
  position: absolute;
  left: -40px;
  z-index: 20;
  width: 310px;
  height: 310px;
  flex-shrink: 0;
  filter: drop-shadow(0 20px 35px rgba(116, 0, 3, 0.6));
}

.vinyl-disc {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  /* Custom radial gradient using #740003, #DA8292, and #F5D6DC */
  background: radial-gradient(circle at center, 
    #1f0001 0%, 
    #740003 14%, 
    #DA8292 14.5%, 
    #740003 29%, 
    #2a0002 29.5%, 
    #F5D6DC 43%, 
    #740003 43.5%, 
    #DA8292 58%, 
    #1f0001 58.5%, 
    #740003 76%, 
    #DA8292 100%);
  border: 5px solid #DA8292;
  box-shadow: 0 0 45px rgba(218, 130, 146, 0.45), inset 0 0 30px rgba(0, 0, 0, 0.9);
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  will-change: transform;
}

.vinyl-disc::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(245, 214, 220, 0.35) 0%, transparent 40%, rgba(218, 130, 146, 0.2) 65%, transparent 100%);
  pointer-events: none;
}

/* CD Center Label with requested palette */
.vinyl-label {
  width: 105px;
  height: 105px;
  border-radius: 50%;
  background: radial-gradient(circle, #740003 0%, #3a0002 100%);
  border: 3px solid #DA8292;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  box-shadow: inset 0 0 12px rgba(0,0,0,0.8), 0 0 20px rgba(218, 130, 146, 0.5);
  z-index: 2;
}

.vinyl-label-title {
  font-family: 'Great Vibes', cursive;
  font-size: 28px;
  font-weight: 700;
  color: #F5D6DC;
  text-shadow: 0 0 10px rgba(245, 214, 220, 0.7);
}

.vinyl-center-hole {
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: radial-gradient(circle, #050102 55%, #DA8292 100%);
  margin-top: 3px;
}

/* Filmstrip Track Container */
.filmstrip-viewport {
  width: 100vw;
  height: 100%;
  overflow: hidden;
  position: relative;
  background: rgba(12, 1, 2, 0.92);
  border-top: 3.5px solid rgba(218, 130, 146, 0.5);
  border-bottom: 3.5px solid rgba(218, 130, 146, 0.5);
  box-shadow: 0 20px 45px rgba(0, 0, 0, 0.8);
  display: flex;
  align-items: center;
}

.sprocket-border {
  position: absolute;
  left: 0;
  width: 100%;
  height: 22px;
  z-index: 15;
  background: repeating-linear-gradient(
    90deg,
    transparent 0px,
    transparent 12px,
    #050001 12px,
    #050001 26px,
    transparent 26px,
    transparent 38px
  );
  border-top: 1px solid rgba(218, 130, 146, 0.25);
  border-bottom: 1px solid rgba(218, 130, 146, 0.25);
}

.sprocket-border.top { top: 6px; }
.sprocket-border.bottom { bottom: 6px; }

.filmstrip-track {
  display: flex;
  gap: 32px;
  will-change: transform;
  width: max-content;
  padding-left: 310px;
  padding-right: 80px;
  align-items: center;
}

.film-frame {
  flex-shrink: 0;
  width: 320px;
  height: 200px;
  background: linear-gradient(135deg, rgba(116, 0, 3, 0.45), rgba(30, 1, 2, 0.85));
  border: 1.5px solid var(--border-pink);
  border-radius: 16px;
  position: relative;
  box-shadow: 0 10px 28px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(245, 214, 220, 0.15);
  transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
  overflow: hidden;
}

.film-frame:hover {
  transform: translateY(-6px) scale(1.02);
  border-color: var(--accent-soft);
  box-shadow: 0 15px 35px rgba(0, 0, 0, 0.75), 0 0 20px rgba(218, 130, 146, 0.35);
}

.audio-fab {
  position: fixed; bottom: 22px; left: 22px; z-index: 1000;
  width: 44px; height: 44px; border-radius: 50%;
  background: rgba(59, 2, 4, 0.7);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border: 1.5px solid var(--accent-soft);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  box-shadow: 0 4px 18px rgba(0, 0, 0, 0.5), 0 0 14px rgba(245, 214, 220, 0.25);
  transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s ease, border-color 0.3s ease;
}

.audio-fab:hover {
  transform: scale(1.1);
  box-shadow: 0 6px 22px rgba(245, 214, 220, 0.45);
  border-color: #ffffff;
}

.audio-fab svg {
  width: 20px; height: 20px; fill: var(--accent-soft); transition: fill 0.2s ease;
}

.audio-fab:hover svg { fill: #ffffff; }

.audio-fab.playing::before {
  content: ''; position: absolute; inset: -5px; border-radius: 50%;
  border: 1.5px solid var(--accent-pink);
  animation: pulseWave 1.8s infinite ease-out; opacity: 0;
}

@keyframes pulseWave {
  0% { transform: scale(0.9); opacity: 0.85; }
  100% { transform: scale(1.38); opacity: 0; }
}

@media (max-width: 768px) {
  .vinyl-wrapper { width: 220px; height: 220px; left: -30px; }
  .vinyl-label { width: 75px; height: 75px; }
  .vinyl-label-title { font-size: 20px; }
  .filmstrip-track { padding-left: 210px; gap: 20px; }
  .film-frame { width: 230px; height: 155px; border-radius: 12px; }
  .filmstrip-hero-container { height: 250px; }
}

@media (max-width: 600px) {
  .site-content { padding-top: 20px; }
  .video-card { padding: 10px; border-radius: 20px; }
  .video-wrapper { border-radius: 14px; }
  .audio-fab { bottom: 18px; left: 18px; width: 40px; height: 40px; }
  .audio-fab svg { width: 17px; height: 17px; }
  .volume-slider { width: 50px; }
}
</style>
</head>
<body>

<div class="pin-overlay" id="pinOverlay">
  <div class="pin-card" id="pinCard">
    <div class="pin-title">ENTER PIN CODE</div>
    <p class="pin-subtitle">Please enter the secret 4-digit code</p>
    
    <div class="pin-input-group" id="pinGroup">
      <input type="password" maxlength="1" class="pin-digit" pattern="[0-9]*" inputmode="numeric" autofocus>
      <input type="password" maxlength="1" class="pin-digit" pattern="[0-9]*" inputmode="numeric">
      <input type="password" maxlength="1" class="pin-digit" pattern="[0-9]*" inputmode="numeric">
      <input type="password" maxlength="1" class="pin-digit" pattern="[0-9]*" inputmode="numeric">
    </div>
    
    <button class="pin-btn" onclick="verifyPin()">UNLOCK</button>
  </div>
</div>

<main class="site-content" id="siteContent">
  <!-- Header Title -->
  <header class="birthday-header">
    <div class="banner-line-1">HAPPY BIRTHDAY</div>
    <div class="banner-line-2">HALA</div>
  </header>

  <!-- Video Section -->
  <section class="video-section">
    <div class="video-card">
      <div class="video-wrapper" id="videoWrapper">
        <video id="birthdayVideo" preload="metadata">
          <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" type="video/mp4">
          Your browser does not support the video tag.
        </video>
        
        <div class="video-overlay-btn" id="videoOverlayBtn" onclick="togglePlayVideo()">
          <div class="play-icon-circle">
            <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          </div>
        </div>

        <div class="custom-controls" id="customControls">
          <div class="progress-bar-container" id="progressBar" onclick="seekVideo(event)">
            <div class="progress-fill" id="progressFill"></div>
          </div>
          <div class="controls-row">
            <div class="controls-left">
              <button class="ctrl-btn" onclick="togglePlayVideo()" title="Play/Pause">
                <svg id="playPauseIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
              </button>
              <span id="timeDisplay">0:00 / 0:00</span>
            </div>
            <div class="controls-right">
              <div class="volume-group">
                <button class="ctrl-btn" onclick="toggleMuteVideo()" title="Mute/Unmute">
                  <svg id="videoMuteIcon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
                </button>
                <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.05" value="1" oninput="changeVolume(this.value)">
              </div>
              <button class="ctrl-btn" onclick="toggleFullscreen()" title="Fullscreen">
                <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Horizontal Scroll Gallery with Redesigned CD -->
  <section class="gallery-scroll-section" id="galleryScrollSection">
    <div class="gallery-sticky-pin">
      <div class="filmstrip-hero-container">
        
        <div class="vinyl-wrapper">
          <div class="vinyl-disc" id="vinylDisc">
            <div class="vinyl-label">
              <span class="vinyl-label-title">Hala</span>
              <div class="vinyl-center-hole"></div>
            </div>
          </div>
        </div>

        <div class="filmstrip-viewport" id="filmstripViewport">
          <div class="sprocket-border top"></div>

          <div class="filmstrip-track" id="filmstripTrack">
            <div class="film-frame"></div>
            <div class="film-frame"></div>
            <div class="film-frame"></div>
            <div class="film-frame"></div>
            <div class="film-frame"></div>
            <div class="film-frame"></div>
            <div class="film-frame"></div>
            <div class="film-frame"></div>
          </div>

          <div class="sprocket-border bottom"></div>
        </div>

      </div>
    </div>
  </section>

</main>

<!-- Audio Floating Button -->
<audio id="bgMusic" loop preload="auto">
  <source src="https://www.adorely.app/music/library/happy-birthday-song.mp3" type="audio/mp3">
</audio>

<button class="audio-fab" id="audioFab" title="Toggle Music" onclick="toggleAudio()">
  <svg id="speakerIcon" viewBox="0 0 24 24">
    <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
  </svg>
</button>

<script>
const CORRECT_PIN = "8888";
const pinOverlay = document.getElementById('pinOverlay');
const pinCard = document.getElementById('pinCard');
const siteContent = document.getElementById('siteContent');
const pinInputs = document.querySelectorAll('.pin-digit');
const bgMusic = document.getElementById('bgMusic');
const audioFab = document.getElementById('audioFab');
const speakerIcon = document.getElementById('speakerIcon');

pinInputs.forEach((input, index) => {
  input.addEventListener('input', (e) => {
    if (e.target.value.length === 1 && index < pinInputs.length - 1) {
      pinInputs[index + 1].focus();
    }
    if (getFullPin().length === 4) {
      verifyPin();
    }
  });

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Backspace' && !input.value && index > 0) {
      pinInputs[index - 1].focus();
    }
  });
});

function getFullPin() {
  let pin = "";
  pinInputs.forEach(i => pin += i.value);
  return pin;
}

function verifyPin() {
  const entered = getFullPin();
  if (entered === CORRECT_PIN) {
    pinOverlay.classList.add('unlocked');
    siteContent.classList.add('visible');
    playMusic();
  } else {
    pinCard.classList.add('shake');
    setTimeout(() => {
      pinCard.classList.remove('shake');
      pinInputs.forEach(i => i.value = '');
      pinInputs[0].focus();
    }, 400);
  }
}

function updateAudioIcon(isPlaying) {
  if (isPlaying) {
    speakerIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
  } else {
    speakerIcon.innerHTML = '<path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>';
  }
}

function playMusic() {
  bgMusic.play().then(() => {
    audioFab.classList.add('playing');
    updateAudioIcon(true);
  }).catch((e) => {
    console.log("Audio autoplay restricted:", e);
  });
}

function toggleAudio() {
  if (bgMusic.paused) {
    bgMusic.play().then(() => {
      audioFab.classList.add('playing');
      updateAudioIcon(true);
    });
  } else {
    bgMusic.pause();
    audioFab.classList.remove('playing');
    updateAudioIcon(false);
  }
}

const birthdayVideo = document.getElementById('birthdayVideo');
const videoOverlayBtn = document.getElementById('videoOverlayBtn');
const playPauseIcon = document.getElementById('playPauseIcon');
const progressFill = document.getElementById('progressFill');
const timeDisplay = document.getElementById('timeDisplay');
const videoWrapper = document.getElementById('videoWrapper');
const volumeSlider = document.getElementById('volumeSlider');
const videoMuteIcon = document.getElementById('videoMuteIcon');

function updateVolumeTrack(val) {
  const pct = (val * 100);
  volumeSlider.style.background = `linear-gradient(to right, #ffffff ${pct}%, rgba(255, 255, 255, 0.25) ${pct}%)`;
}

updateVolumeTrack(volumeSlider.value);

function togglePlayVideo() {
  if (birthdayVideo.paused || birthdayVideo.ended) {
    if (!bgMusic.paused) {
      bgMusic.pause();
      audioFab.classList.remove('playing');
      updateAudioIcon(false);
    }
    birthdayVideo.play();
  } else {
    birthdayVideo.pause();
  }
}

birthdayVideo.addEventListener('play', () => {
  videoOverlayBtn.classList.add('hidden');
  playPauseIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
});

birthdayVideo.addEventListener('pause', () => {
  videoOverlayBtn.classList.remove('hidden');
  playPauseIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
});

birthdayVideo.addEventListener('timeupdate', () => {
  if (birthdayVideo.duration) {
    const percent = (birthdayVideo.currentTime / birthdayVideo.duration) * 100;
    progressFill.style.width = percent + '%';
    timeDisplay.textContent = formatTime(birthdayVideo.currentTime) + ' / ' + formatTime(birthdayVideo.duration);
  }
});

function seekVideo(e) {
  const rect = e.currentTarget.getBoundingClientRect();
  const pos = (e.clientX - rect.left) / rect.width;
  birthdayVideo.currentTime = pos * birthdayVideo.duration;
}

function changeVolume(val) {
  birthdayVideo.volume = parseFloat(val);
  birthdayVideo.muted = (val === "0");
  updateVolumeTrack(val);
  updateMuteIcon();
}

function toggleMuteVideo() {
  birthdayVideo.muted = !birthdayVideo.muted;
  if (birthdayVideo.muted) {
    volumeSlider.value = 0;
    updateVolumeTrack(0);
  } else {
    volumeSlider.value = birthdayVideo.volume || 1;
    updateVolumeTrack(volumeSlider.value);
  }
  updateMuteIcon();
}

function updateMuteIcon() {
  if (birthdayVideo.muted || birthdayVideo.volume === 0) {
    videoMuteIcon.innerHTML = '<path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>';
  } else {
    videoMuteIcon.innerHTML = '<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>';
  }
}

function toggleFullscreen() {
  if (!document.fullscreenElement) {
    videoWrapper.requestFullscreen().catch(err => {
      console.log(err);
    });
  } else {
    document.exitFullscreen();
  }
}

function formatTime(seconds) {
  const m = Math.floor(seconds / 60);
  const s = Math.floor(seconds % 60);
  return m + ':' + (s < 10 ? '0' : '') + s;
}

document.addEventListener('keydown', (e) => {
  if (document.activeElement.tagName === 'INPUT') return;

  switch (e.code) {
    case 'Space':
      e.preventDefault();
      togglePlayVideo();
      break;
    case 'KeyM':
      e.preventDefault();
      toggleMuteVideo();
      break;
    case 'KeyF':
      e.preventDefault();
      toggleFullscreen();
      break;
    case 'ArrowLeft':
      e.preventDefault();
      birthdayVideo.currentTime = Math.max(0, birthdayVideo.currentTime - 5);
      break;
    case 'ArrowRight':
      e.preventDefault();
      birthdayVideo.currentTime = Math.min(birthdayVideo.duration, birthdayVideo.currentTime + 5);
      break;
    case 'ArrowUp':
      e.preventDefault();
      birthdayVideo.volume = Math.min(1, birthdayVideo.volume + 0.1);
      volumeSlider.value = birthdayVideo.volume;
      updateVolumeTrack(birthdayVideo.volume);
      birthdayVideo.muted = false;
      updateMuteIcon();
      break;
    case 'ArrowDown':
      e.preventDefault();
      birthdayVideo.volume = Math.max(0, birthdayVideo.volume - 0.1);
      volumeSlider.value = birthdayVideo.volume;
      updateVolumeTrack(birthdayVideo.volume);
      updateMuteIcon();
      break;
  }
});

const gallerySection = document.getElementById('galleryScrollSection');
const vinylDisc = document.getElementById('vinylDisc');
const filmstripTrack = document.getElementById('filmstripTrack');

function handleScrollDrivenFilmstrip() {
  if (!gallerySection) return;

  const rect = gallerySection.getBoundingClientRect();
  const sectionHeight = gallerySection.offsetHeight;
  const windowHeight = window.innerHeight;

  const totalScrollDistance = sectionHeight - windowHeight;
  const currentScroll = -rect.top;

  let progress = currentScroll / totalScrollDistance;
  progress = Math.max(0, Math.min(1, progress));

  // Reduced rotation rate (360 degrees total) for much smoother and slower CD rotation
  const rotationDeg = progress * 360;
  vinylDisc.style.transform = `rotate(${rotationDeg}deg)`;

  // Smooth horizontal translation of cards track
  const maxSlide = filmstripTrack.scrollWidth - window.innerWidth + 80;
  const translateX = -(progress * Math.max(0, maxSlide));
  filmstripTrack.style.transform = `translateX(${translateX}px)`;
}

window.addEventListener('scroll', handleScrollDrivenFilmstrip);
window.addEventListener('resize', handleScrollDrivenFilmstrip);
</script>
